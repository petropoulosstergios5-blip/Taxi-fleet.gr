<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ταξί Στόλος</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1C2128" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!--
      Google Maps JavaScript API.

      IMPORTANT — replace YOUR_BROWSER_KEY_HERE with your *browser* Maps key.
      This key is necessarily visible in the page source (the map is drawn in the
      browser, so it cannot be proxied through our server the way the Places/Routes
      key is). Protect it in Google Cloud instead:
        Credentials -> that key -> Application restrictions -> Websites, and allow only:
            https://taxi-fleet-gr.vercel.app/*
        API restrictions -> Restrict key -> Maps JavaScript API only
      With those two restrictions the key is useless to anyone else.
      Use a SEPARATE key from the server one in maps-proxy (that one must stay secret).
    -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7pXKRBiCTlCmoYVjSeFW_mT9fADPRNiQ&language=el&region=GR&loading=async"
      async defer
    ></script>
    <style>
      html, body { background: #1C2128; overflow-x: hidden; max-width: 100vw; }
      * { box-sizing: border-box; }
      .admin-tabs-desktop { display: flex; }
      .admin-tabs-mobile { display: none; }
      @media (max-width: 700px) {
        .admin-tabs-desktop { display: none; }
        .admin-tabs-mobile { display: flex; }
      }
    </style>
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
